name: Tests

# The kit runtime and all four apps against stand-ins (no SDK, renderer or car needed).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node kit/tools/test_runtime.js
      - run: node kit/tools/test_cluster_info_overlay.js
      - run: node kit/tools/test_cluster_info.js
      # test_logs decodes the Logs screen's QR codes from simulated photos with OpenCV
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install opencv-python-headless==4.10.0.84
      # Cluster Layouts and Cluster Centre; test_shared checks the apps' copies of shared/ are current
      # (tools/test_built.js needs the SDK, so it runs locally only)
      - run: |
          for t in engine app centre data finder logs providers shared signals; do
            echo "== tools/test_$t.js"; node tools/test_$t.js
          done
